<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Place Details</title>
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <a href="index.html"><img src="images/logo.png" alt="HBnB Logo" class="logo"></a>
        <nav>
            <a href="login.html" class="login-button">Login</a>
        </nav>
    </header>

    <main>
        <article class="place-details">
            <h2>Cozy Beach Apartment</h2>
            <section class="place-info">
                <p><strong>Host:</strong> John Doe</p>
                <p><strong>Price:</strong> $120 per night</p>
                <p><strong>Description:</strong> A beautiful ocean-view apartment with all amenities.</p>
                <p><strong>Amenities:</strong> Wi-Fi, Pool, Air Conditioning</p>
            </section>
        </article>

        <section>
            <h3 style="margin-top: 20px;">Reviews</h3>
            <article class="review-card">
                <p><strong>Jane Smith:</strong> "Amazing place! Loved the view."</p>
                <p>Rating: ★★★★★</p>
            </article>

            <a href="add_review.html" class="details-button" style="margin-top: 15px;">Add Review</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HBnB. All rights reserved.</p>
    </footer>
</body>
</html>
