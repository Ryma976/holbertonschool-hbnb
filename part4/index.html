<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Accommodation Listing</title>
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="HBnB Logo" class="logo">
        <nav>
            <a href="login.html" class="login-button">Login</a>
        </nav>
    </header>

    <main>
        <h2>Available Places</h2>
        <section class="places-list">
            <article class="place-card">
                <h3>Cozy Beach Apartment</h3>
                <p class="price">$120 per night</p>
                <a href="place.html" class="details-button">View Details</a>
            </article>
            <article class="place-card">
                <h3>Modern Downtown Loft</h3>
                <p class="price">$200 per night</p>
                <a href="place.html" class="details-button">View Details</a>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HBnB. All rights reserved.</p>
    </footer>
</body>
</html>
